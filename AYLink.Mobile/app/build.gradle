plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jlleitschuh.gradle.ktlint'
}

def releaseStoreFile = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: releaseStorePassword
def appVersionName = (System.getenv("ANDROID_VERSION_NAME") ?: "0.1.0").trim()
def appVersionCode = resolveAndroidVersionCode(System.getenv("ANDROID_VERSION_CODE"), appVersionName)

android {
    namespace = 'com.aylink.mobile'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.aylink.mobile"
        minSdk = 26
        targetSdk = 36
        versionCode = appVersionCode
        versionName = appVersionName

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseStoreFile) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

tasks.named("check").configure {
    dependsOn("lintDebug")
}

ktlint {
    version = "1.5.0"
    android = true
    ignoreFailures = false
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    def composeBom = platform("androidx.compose:compose-bom:2025.10.00")
    implementation composeBom
    androidTestImplementation composeBom
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    // 与应用 OkHttp 4.12.0 一致，确保设备测试覆盖相同的网络实现。
    //noinspection NewerVersionAvailable
    androidTestImplementation "com.squareup.okhttp3:mockwebserver:5.5.0"

    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.activity:activity-compose:1.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"

    implementation "androidx.navigation:navigation-compose:2.8.8"

    implementation "androidx.compose.material:material-icons-core:1.7.8"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0"

    implementation "com.squareup.okhttp3:okhttp:5.5.0"
    implementation "com.squareup.okhttp3:logging-interceptor:5.5.0"
    implementation "androidx.concurrent:concurrent-futures:1.2.0"

    implementation("com.termux.termux-app:terminal-view:0.118.0") {
        exclude group: "com.termux.termux-app", module: "terminal-emulator"
    }
    implementation project(":terminal-emulator")

    implementation "io.github.webrtc-sdk:android:144.7559.15"
}

static int resolveAndroidVersionCode(String explicitVersionCode, String versionName) {
    if (explicitVersionCode != null && !explicitVersionCode.trim().isEmpty()) {
        return explicitVersionCode.trim().toInteger()
    }

    def matcher = versionName =~ /(\d+)\.(\d+)\.(\d+)/
    if (matcher.matches()) {
        def major = matcher.group(1).toInteger()
        def minor = matcher.group(2).toInteger()
        def patch = matcher.group(3).toInteger()
        return major * 10000 + minor * 100 + patch
    }

    return 1
}

pluginManagement {
    repositories {
        def isGitHubActions = System.getenv("GITHUB_ACTIONS") == "true"
        if (!isGitHubActions) {
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/gradle-plugins/' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/google/' }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        def isGitHubActions = System.getenv("GITHUB_ACTIONS") == "true"
        if (!isGitHubActions) {
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/google/' }
        }
        maven { url 'https://jitpack.io' }
        google()
        mavenCentral()
    }
}

rootProject.name = 'AYLink.Mobile'
include ':app'

name: Build and Release AYLink

on:
  push:
    tags:
      - '*'
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SCRCPY_SERVER_VERSION: '4.0'
  APP_VERSION: '1.0.0'
  APP_RELEASE_TAG: 'v1.0.0'
  ANDROID_VERSION_NAME: '0.1.0'
  ANDROID_VERSION_CODE: '1'
  ALPINE_VERSION: '3.24'
  DOCKER_PLATFORMS: 'linux/amd64,linux/amd64/v2,linux/amd64/v3,linux/arm64,linux/riscv64,linux/386,linux/arm/v7,linux/arm/v6'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      agent_web: ${{ steps.filter.outputs.agent_web }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Check build changes
      id: filter
      run: |
        set -euo pipefail

        mobile_changed=false
        agent_web_changed=false

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
        elif [ "${{ github.ref_type }}" = "tag" ]; then
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"

          if [ -n "${previous_tag}" ]; then
            changed_files="$(git diff --name-only "${previous_tag}..${GITHUB_SHA}")"
          else
            changed_files="$(git ls-tree -r --name-only "${GITHUB_SHA}")"
          fi
        elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          changed_files="$(git diff --name-only "${{ github.event.before }}..${GITHUB_SHA}")"
        else
          changed_files="$(git ls-tree -r --name-only "${GITHUB_SHA}")"
        fi

        if printf '%s\n' "${changed_files}" | grep -Eq '^(AYLink\.Mobile/|\.github/workflows/build\.yml$)'; then
          mobile_changed=true
        fi

        if printf '%s\n' "${changed_files}" | grep -Eq '^(AYLink\.Agent/|AYLink\.Web/|Makefile$|Dockerfile\.release$|scripts/download-scrcpy-server\.sh$|\.github/workflows/build\.yml$)'; then
          agent_web_changed=true
        fi

        echo "mobile=${mobile_changed}" >> "${GITHUB_OUTPUT}"
        echo "agent_web=${agent_web_changed}" >> "${GITHUB_OUTPUT}"
      shell: bash

  build:
    needs: changes
    if: needs.changes.outputs.agent_web == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.1'
        cache: true
        cache-dependency-path: AYLink.Agent/go.sum

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './AYLink.Web/package-lock.json'

    - name: Download scrcpy-server
      run: |
        chmod +x ./scripts/download-scrcpy-server.sh
        ./scripts/download-scrcpy-server.sh ./AYLink.Agent/Scrcpy
      shell: bash

    - name: Resolve build version from tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        echo "APP_RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        echo "ANDROID_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      shell: bash

    - name: Build with Makefile
      # 直接使用 Makefile 构建所有平台
      run: make agent APP_VERSION=${APP_VERSION} APP_RELEASE_TAG=${APP_RELEASE_TAG}
      
    - name: Package artifacts
      run: |
        rm -rf release-packages
        mkdir -p release-packages

        package_release() {
          platform_name="$1"
          binary_name="$2"
          archive_ext="$3"
          staging_dir="release-packages/${platform_name}"

          mkdir -p "${staging_dir}/Scrcpy"
          cp "bin/${binary_name}" "${staging_dir}/"
          cp "AYLink.Agent/Scrcpy/scrcpy-server" "${staging_dir}/Scrcpy/scrcpy-server"

          if [ "${archive_ext}" = "zip" ]; then
            (
              cd "${staging_dir}"
              zip -r "../../bin/AYLink.Agent-${{ github.ref_name }}-${platform_name}.zip" .
            )
          else
            tar czvf "bin/AYLink.Agent-${{ github.ref_name }}-${platform_name}.tar.gz" -C "${staging_dir}" .
          fi
        }

        package_release "windows-amd64" "AYLink-Agent-windows-amd64.exe" "zip"
        package_release "windows-arm64" "AYLink-Agent-windows-arm64.exe" "zip"
        package_release "linux-amd64" "AYLink-Agent-linux-amd64" "tar.gz"
        package_release "linux-amd64-v2" "AYLink-Agent-linux-amd64-v2" "tar.gz"
        package_release "linux-amd64-v3" "AYLink-Agent-linux-amd64-v3" "tar.gz"
        package_release "linux-arm64" "AYLink-Agent-linux-arm64" "tar.gz"
        package_release "linux-riscv64" "AYLink-Agent-linux-riscv64" "tar.gz"
        package_release "linux-ppc64le" "AYLink-Agent-linux-ppc64le" "tar.gz"
        package_release "linux-s390x" "AYLink-Agent-linux-s390x" "tar.gz"
        package_release "linux-arm-v7" "AYLink-Agent-linux-arm-v7" "tar.gz"
        package_release "linux-arm-v6" "AYLink-Agent-linux-arm-v6" "tar.gz"
        package_release "linux-386" "AYLink-Agent-linux-386" "tar.gz"
        package_release "linux-loong64" "AYLink-Agent-linux-loong64" "tar.gz"
        package_release "macos-amd64" "AYLink-Agent-darwin-amd64" "tar.gz"
        package_release "macos-arm64" "AYLink-Agent-darwin-arm64" "tar.gz"
      shell: bash

    - name: Upload binaries
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v6
      with:
        name: aylink-binaries
        path: |
          bin/*.zip
          bin/*.tar.gz

    - name: Prepare Docker build context
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        rm -rf docker-context
        mkdir -p docker-context/bin docker-context/AYLink.Agent/Scrcpy
        cp bin/AYLink-Agent-linux-* docker-context/bin/
        cp -R AYLink.Agent/Scrcpy/. docker-context/AYLink.Agent/Scrcpy/
      shell: bash

    - name: Upload Docker build context
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v6
      with:
        name: aylink-docker-context
        path: docker-context

  android-build:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          AYLink.Mobile/*.gradle
          AYLink.Mobile/gradle.properties
          AYLink.Mobile/gradle/wrapper/gradle-wrapper.properties
          AYLink.Mobile/app/build.gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Decode Android keystore
      if: startsWith(github.ref, 'refs/tags/') && env.ANDROID_KEYSTORE_BASE64 != ''
      working-directory: AYLink.Mobile
      run: |
        echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/aylink-release.jks"
      shell: bash

    - name: Build Android APK
      working-directory: AYLink.Mobile
      env:
        ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/aylink-release.jks
        ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
        ANDROID_VERSION_NAME: ${{ env.ANDROID_VERSION_NAME }}
        ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
      run: |
        chmod +x ./gradlew
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          echo "ANDROID_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME}"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          VERSION_CODE=$((10#${MAJOR} * 10000 + 10#${MINOR} * 100 + 10#${PATCH}))
          echo "ANDROID_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
        fi

        if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
          ANDROID_VERSION_NAME="${GITHUB_REF_NAME#v}" ANDROID_VERSION_CODE="${VERSION_CODE:-${ANDROID_VERSION_CODE}}" ./gradlew assembleRelease
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
        else
          ./gradlew assembleDebug
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        fi

        mkdir -p ../android-release
        cp "${APK_PATH}" ../android-release/AYLink.apk
      shell: bash

    - name: Upload Android artifact
      uses: actions/upload-artifact@v6
      with:
        name: AYLink.apk
        path: android-release/AYLink.apk
        if-no-files-found: error

  docker-build:
    needs: [changes, build]
    if: startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.agent_web == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download Docker build context
      uses: actions/download-artifact@v6
      with:
        name: aylink-docker-context
        path: docker-context

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Verify Docker runtime packages
      run: |
        set -euo pipefail

        map_platform_arch() {
          case "$1" in
            linux/amd64|linux/amd64/v*) echo "x86_64" ;;
            linux/386) echo "x86" ;;
            linux/arm64|linux/arm64/v*) echo "aarch64" ;;
            linux/arm/v7) echo "armv7" ;;
            linux/arm/v6) echo "armhf" ;;
            linux/riscv64) echo "riscv64" ;;
            *) echo "unsupported:$1" ;;
          esac
        }

        checked_arches=""
        IFS=',' read -ra platforms <<< "${DOCKER_PLATFORMS}"
        for platform in "${platforms[@]}"; do
          arch="$(map_platform_arch "${platform}")"
          if [[ "${arch}" == unsupported:* ]]; then
            echo "Unsupported Docker platform mapping: ${platform}" >&2
            exit 1
          fi

          if [[ " ${checked_arches} " == *" ${arch} "* ]]; then
            continue
          fi
          checked_arches="${checked_arches} ${arch}"

          index_url="https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}/community/${arch}/APKINDEX.tar.gz"
          index_file="$(mktemp)"
          curl -fsSL "${index_url}" | tar -xzO APKINDEX > "${index_file}"

          if ! grep -qx 'P:android-tools' "${index_file}"; then
            echo "android-tools is not available for Alpine ${ALPINE_VERSION} ${arch} (${platform})" >&2
            rm -f "${index_file}"
            exit 1
          fi

          rm -f "${index_file}"
        done
      shell: bash

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        export VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
      
        docker buildx build \
        --file Dockerfile.release \
        --platform ${DOCKER_PLATFORMS} \
        --build-arg ALPINE_VERSION=${ALPINE_VERSION} \
        --tag ${{ secrets.DOCKER_HUB_USERNAME }}/aylink.agent:$VERSION \
        --tag ${{ secrets.DOCKER_HUB_USERNAME }}/aylink.agent:latest \
        --push \
        docker-context

        docker buildx build \
        --file Dockerfile.release \
        --platform ${DOCKER_PLATFORMS} \
        --build-arg ALPINE_VERSION=${ALPINE_VERSION} \
        --tag ${{ secrets.DOCKER_HUB_USERNAME }}/aylink.agent:$VERSION \
        --tag ${{ secrets.DOCKER_HUB_USERNAME }}/aylink.agent:latest \
        --output type=oci \
        docker-context > AYLink.Agent-docker.tar
      
        mkdir -p docker-release
        mv AYLink.Agent-docker.tar docker-release/AYLink.Agent-docker-oci-$VERSION.tar
        gzip docker-release/AYLink.Agent-docker-oci-$VERSION.tar

    - name: Upload Docker artifact
      uses: actions/upload-artifact@v6
      with:
        name: AYLink.Agent-docker-image
        path: docker-release/*.tar.gz

  release:
    needs: [changes, build, android-build, docker-build]
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped') &&
      (needs.android-build.result == 'success' || needs.android-build.result == 'skipped') &&
      (needs.build.result == 'success' || needs.android-build.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Resolve previous release tag
      id: previous_tag
      run: |
        previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"

        if [ -z "${previous_tag}" ]; then
          previous_tag="$(git rev-list --max-parents=0 HEAD)"
        fi

        echo "value=${previous_tag}" >> "${GITHUB_OUTPUT}"
      shell: bash

    - name: Download all artifacts
      uses: actions/download-artifact@v6
      with:
        path: artifacts
        merge-multiple: true

    - name: Prepare release files and notes
      id: release_files
      run: |
        set -euo pipefail

        files="$(find artifacts -type f | sort)"
        if [ -z "${files}" ]; then
          echo "No release artifacts found." >&2
          exit 1
        fi

        {
          echo 'files<<EOF'
          printf '%s\n' "${files}"
          echo 'EOF'
        } >> "${GITHUB_OUTPUT}"

        printf '%s\n\n' '${{ github.ref_name }}' > release-body.md
        printf '%s\n' 'Full Changelog: [${{ steps.previous_tag.outputs.value }}...${{ github.ref_name }}](https://github.com/${{ github.repository }}/compare/${{ steps.previous_tag.outputs.value }}...${{ github.ref_name }})' >> release-body.md

        if [ "${{ needs.android-build.result }}" = "success" ]; then
          printf '\n%s\n' '[AYLink.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AYLink.apk)' >> release-body.md
        fi

        if [ "${{ needs.docker-build.result }}" = "success" ]; then
          printf '\n%s\n' 'Docker 离线镜像为 OCI 标准，无法在老版本的 Docker（20.10 之前）中使用。' >> release-body.md
          printf '%s\n\n' 'The offline Docker image uses the OCI format and cannot be used with older Docker versions before 20.10.' >> release-body.md
          printf '%s\n' '推荐直接使用 `docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/aylink.agent:latest` 获取最新镜像。' >> release-body.md
          printf '%s\n\n' 'It is recommended to use `docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/aylink.agent:latest` to get the latest image.' >> release-body.md
          printf '%s\n' '也可以直接使用 `docker-compose.yml` 快速部署。' >> release-body.md
          printf '%s\n' 'You can also use `docker-compose.yml` for quick deployment.' >> release-body.md
        fi
      shell: bash

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        body_path: release-body.md
        files: ${{ steps.release_files.outputs.files }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

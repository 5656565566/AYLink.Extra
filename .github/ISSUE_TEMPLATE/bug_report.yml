name: "🐞 Bug Report / Bug 反馈"
description: "Report a bug or unexpected behavior / 报告程序错误或异常行为"
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component / 组件
      description: Which component is affected? / 受影响的组件是？
      options:
        - AYLink.Web
        - AYLink.Agent
        - AYLink.Mobile
        - Other / 其他组件
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description / 问题描述
      description: Describe what happened / 请描述发生了什么
      placeholder: |
        CN: 请清楚描述问题现象。
        EN: Please clearly describe the issue.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce / 复现步骤
      description: How can we reproduce this issue? / 如何复现这个问题？
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...

        1. 打开...
        2. 点击...
        3. 出现错误...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior / 期望行为
      description: What did you expect to happen? / 你期望发生什么？
      placeholder: |
        CN: 描述你期望的正确结果。
        EN: Describe the expected correct behavior.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / 实际行为
      description: What actually happened? / 实际发生了什么？
      placeholder: |
        CN: 描述实际结果。
        EN: Describe the actual result.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, Screenshots, or Videos / 日志、截图或录屏
      description: Paste logs or attach screenshots/videos if available / 如有日志、截图或录屏，请附上
      placeholder: |
        CN: 可粘贴错误日志，或补充截图。
        EN: Paste error logs or attach screenshots here.

  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Application version / 软件版本
      placeholder: "e.g. v0.0.6"

  - type: input
    id: environment
    attributes:
      label: Environment / 运行环境
      description: OS, device, architecture, etc. / 操作系统、设备、架构等
      placeholder: "e.g. Windows 11 x64 / Android 14 / macOS 15"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context / 补充信息
      description: Anything else we should know? / 还有其他需要补充的吗？
      placeholder: |
        CN: 补充任何相关背景信息。
        EN: Add any other relevant context.
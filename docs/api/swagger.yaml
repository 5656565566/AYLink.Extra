      reason:
        type: string
      state:
        type: string
      stateSince:
        type: string
    type: object
  webrtc.VideoSourceDiagnostics:
    properties:
      hasSeenMediaPacket:
        type: boolean
      lastKeyFrameAt:
        type: string
      lastKeyFrameReplayAt:
        type: string
      lastNewPtsAt:
        type: string
      lastPacketAt:
        type: string
      lastPts:
        type: integer
      lastVideoRefreshAt:
        type: string
      reason:
        type: string
      repeatedPtsCount:
        type: integer
      runtimeClosed:
        type: boolean
      state:
        type: string
    type: object
  webrtc.VideoStreamHealthOrigin:
    enum:
    - unknown
    - source
    - sender
    - transport
    - client
    type: string
    x-enum-varnames:
    - VideoStreamHealthOriginUnknown
    - VideoStreamHealthOriginSource
    - VideoStreamHealthOriginSender
    - VideoStreamHealthOriginTransport
    - VideoStreamHealthOriginClient
  webrtc.VideoStreamState:
    enum:
    - idle
    - connecting
    - observing
    - stable
    - stalled
    - recovering
    - detached
    type: string
    x-enum-varnames:
    - VideoStreamStateIdle
    - VideoStreamStateConnecting
    - VideoStreamStateObserving
    - VideoStreamStateStable
    - VideoStreamStateStalled
    - VideoStreamStateRecovering
    - VideoStreamStateDetached
  webrtc.VideoTransportDiagnostics:
    properties:
      peerConnectionState:
        type: string
      sessionClosed:
        type: boolean
      signalingAttached:
        type: boolean
    type: object
info:
  contact: {}
  description: AYLink Agent 的 HTTP API 文档。
  title: AYLink Agent API
  version: "1.0"
paths:
  /api/accounts/roles:
    get:
      description: 返回角色和可用权限，用于账户管理页面。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.RolesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取角色列表
      tags:
      - 账户管理
    post:
      consumes:
      - application/json
      description: 创建角色并设置权限和可访问设备分组。
      parameters:
      - description: 角色参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.RoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建角色
      tags:
      - 账户管理
  /api/accounts/roles/{id}:
    put:
      consumes:
      - application/json
      description: 更新角色名称、说明、权限和可访问设备分组。
      parameters:
      - description: 角色 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 角色参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.RoleResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新角色
      tags:
      - 账户管理
  /api/accounts/users:
    get:
      description: 返回用户、角色和可用权限，用于账户管理页面。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UsersResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户列表
      tags:
      - 账户管理
    post:
      consumes:
      - application/json
      description: 创建一个新用户，并设置角色和可访问设备分组。
      parameters:
      - description: 用户参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - 账户管理
  /api/accounts/users/{id}:
    delete:
      description: 删除指定用户。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: 删除成功
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 账户管理
    put:
      consumes:
      - application/json
      description: 更新用户名称、启用状态、角色和可访问设备分组。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 用户参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新用户
      tags:
      - 账户管理
  /api/accounts/users/{id}/activate:
    post:
      description: 启用或禁用指定用户。
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'

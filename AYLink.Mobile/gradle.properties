org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Optional Gradle proxy configuration for mainland China network environments.
# Uncomment and replace with your local proxy when needed.
# Prefer configuring local-only proxy settings in ~/.gradle/gradle.properties
# instead of committing them to the repository, so CI environments can resolve
# dependencies without inheriting a localhost proxy.
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7890
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7890
#systemProp.http.nonProxyHosts=localhost|127.0.0.1|10.*|192.168.*|172.16.*|172.17.*|172.18.*|172.19.*|172.2*.*|172.30.*|172.31.*
#systemProp.https.nonProxyHosts=localhost|127.0.0.1|10.*|192.168.*|172.16.*|172.17.*|172.18.*|172.19.*|172.2*.*|172.30.*|172.31.*
